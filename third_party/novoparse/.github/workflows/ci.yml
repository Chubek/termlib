name: Build and test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ldc cmake g++ python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ldc cmake g++ python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST_SANITIZERS=ON
      - name: Build native tests
        run: cmake --build build --target novoparse_c_tests novoparse_cpp_tests --parallel 2
      - name: Test native ownership
        run: ctest --test-dir build -R '^(c_runtime|cpp_runtime)$' --output-on-failure
